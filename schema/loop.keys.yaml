# THE GRAMMAR. This file is the language definition.
#
# It is the single source of truth for three things that were drifting apart:
#   1. validation      — tools/loop.py refuses unknown keys and bad enums
#   2. the reference   — SPEC-FORMAT.md's key table is GENERATED from this
#   3. JSON Schema     — schema/loop.schema.json is GENERATED from this
#
# Briefing §6.2 asked for exactly this discipline for the book's notation, on the grounds that
# hand-maintained notation went stale within hours. The same argument applies here and the
# consequence is worse: a hand-maintained format reference that disagrees with the parser is
# how an LLM writes a spec that silently does nothing.
#
# WHY UNKNOWN KEYS ARE AN ERROR AND NOT A WARNING:
# a spec misspelling `reversibility` as `reversability` on an act called `wipe_production`
# previously parsed clean and produced no finding. The most dangerous declaration in the
# format is the easiest to lose. In a format written mostly by LLMs, silent key loss is the
# defining failure mode, so every key is closed and every enum is checked.

version: 0

# ---------------------------------------------------------------------------------------
top_level:
  loop:
    type: str
    required: true
    doc: The loop's name. One document per loop; `---` separates loops in a group.
    aliases: [name]
  every:
    type: str
    doc: >
      The loop's clock — how often it runs. Free text (`weekly`, `per_question`, `5m`)
      because cadence is domain-specific; the linter checks presence, not units.
  regulates:  {type: map, of: regulates_entry, doc: What the loop steers toward a target.}
  estimates:  {type: map, of: estimates_entry, doc: What it believes but cannot see directly.}
  observes:   {type: map, of: observes_entry,  doc: What actually arrives from the world.}
  acts:       {type: map, of: acts_entry,      doc: The levers it may pull.}
  when:       {type: list, of: when_entry,     doc: The rule selecting among acts.}
  parties:    {type: map, of: parties_entry,   doc: Who is involved and what it costs them.}
  never:      {type: list, of: str, doc: Guardrails that hold regardless of the objective.}
  ignoring:
    type: list
    of: str
    doc: >
      Declared out of scope. Not decoration — this is the revision frontier, the list you
      revisit when the loop misbehaves for reasons it cannot see.

# ---------------------------------------------------------------------------------------
regulates_entry:
  target:
    type: str
    doc: The setpoint, as a readable comparison — `< 400`, `>= 3 sources`, prose is fine.
  computed_from: {type: list, of: str, doc: Inputs this quantity is derived from.}
  confidence:
    type: number
    doc: >
      How firmly the target itself is held, 0–1. Uncertainty about what you WANT, distinct
      from uncertainty about the world. A target held at 0.7 and one held at 0.99 warrant
      different revision policies. Candidate finding, per Briefing §7 — accepted here as an
      OPTIONAL field only, and it does not enter the primitive catalog on this evidence.

estimates_entry:
  from:   {type: list, of: str, doc: Signals feeding this belief. Each must appear in `observes`.}
  method: {type: str, doc: "How the belief is formed: bayesian, judgement, frequency, model…"}
  calibrated_by:
    type: str
    doc: >
      What scores this estimator's PAST predictions against what happened. Its absence is the
      single most common defect found in real loops — three independent authors, none careless.
  window: {type: str, doc: Over what period calibration scores.}
  explains:
    type: str
    doc: >
      The quantity this belief is a MODEL OF. Conant & Ashby 1970: every good regulator of a
      system must be a model of that system. Without this the loop is a reflex.
  settled_by:
    type: str
    doc: The observable that would finally decide this — what makes the belief refutable.
  idempotency_basis:
    type: str
    doc: >
      What makes a repeated update safe. Execution is at-least-once on every durable runtime,
      and a Bayesian update applied twice double-counts into a well-formed but WRONG posterior.

observes_entry:
  measures: {type: str, doc: The estimand this signal informs. Omit and it is an orphan.}
  every:    {type: str, doc: Sampling period.}
  cost:     {type: str, enum: [low, medium, high], doc: What it costs to obtain.}
  asserted_by:
    type: str
    doc: >
      A party who REPORTS this rather than a mechanism that measures it. A reported number is
      a claim by someone with interests, not an observation.
  produced_by:
    type: str
    doc: >
      An act inside this system that manufactures this signal. Load-bearing for groups: a loop
      whose every input is produced_by something inside it cannot be corrected from outside.

acts_entry:
  moves:  {type: str, doc: The estimand this act drives. Absence means the target is a wish.}
  delay:  {type: str, doc: Lag between acting and seeing the effect.}
  damping: {type: str, doc: Deadband, hysteresis or rate limit. Delay without it oscillates.}
  reversibility:
    type: str
    enum: [reversible, costly, irreversible]
    doc: >
      THE LOAD-BEARING FIELD. Approval demanded everywhere is ignored; approval demanded where
      the act cannot be undone is a rule people follow. `costly` means undoable at real cost.
  approval:
    type: str
    doc: Party whose approval gates this act. Must name a party in `parties`.
  consumes: {type: list, of: str, doc: Finite resources this act draws down.}

when_entry:
  if:       {type: str, doc: The condition, in readable prose or expression form.}
  do:       {type: [str, list], doc: Act(s) to take. Must name entries in `acts`.}
  escalate: {type: str, doc: Party the loop stops and asks. Must name a party in `parties`.}

parties_entry:
  human: {type: bool, doc: A person. Mutually exclusive with `agent`.}
  agent: {type: bool, doc: An automated actor. Mutually exclusive with `human`.}
  kind:  {type: str, enum: [human, agent, system], doc: Explicit alternative to the above.}
  bears:
    type: str
    doc: >
      What this party loses when the loop is wrong. `nothing` is a legitimate and revealing
      answer — an agent that bears nothing and a human who bears everything is the asymmetry
      that explains overrides looking irrational against the agent's objective.
  sees:
    type: list
    of: str
    doc: >
      Estimands whose value reaches this party. A party that bears a consequence and sees
      nothing is accountable and blind — human oversight as compliance theatre.
  authority: {type: str, doc: What this party may decide.}
  asymmetry: {type: str, doc: How this party's exposure differs from others'.}
