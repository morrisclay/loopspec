nodes:
- id: spacex_dev_practice
  kind: System
  description: The development practice at SpaceX, focused on making failure affordable to accelerate
    learning.
- id: company_boundary
  kind: Boundary
  description: The boundary of the company, which is actively managed via vertical integration.
- id: engineering_leadership
  kind: Party
  description: The leadership group making strategic decisions about development.
- id: vehicle_performance
  kind: Estimand
  description: The actual performance characteristics of a launch vehicle during flight.
- id: failure_root_cause
  kind: Estimand
  description: The specific reason for an in-flight anomaly or failure.
- id: flight_data
  kind: Signal
  description: Telemetry and other data gathered during a flight test.
- id: inspected_hardware
  kind: Signal
  description: Evidence gathered from inspecting a recovered, flight-proven booster.
- id: post_flight_analysis
  kind: Estimator
  idempotency_basis: Per-flight unique ID.
  description: The process of analyzing flight data and hardware to understand performance and failures.
- id: performance_estimate
  kind: Estimate
  description: The current understanding of the vehicle's performance and failure modes.
- id: orbital_capability
  kind: DesiredCondition
  description: The goal of achieving a reliable orbital launch system.
- id: project_failure
  kind: Consequence
  description: Failure to achieve the desired launch capability, borne by leadership.
- id: bring_supplier_in_house
  kind: Intervention
  target: own-structure
  motive: To shorten the delay and increase the fidelity of information about components.
- id: develop_reusability
  kind: Intervention
  target: own-structure
  motive: To reduce the cost of evidence acquisition and create a new evidence source (flown hardware).
- id: increase_launch_cadence
  kind: Intervention
  target: own-structure
  motive: To increase the rate of learning by prioritizing more attempts over better prediction.
- id: launch_prototype
  kind: Intervention
  target: world
  description: Launch a vehicle with the expectation that it may fail, to gather data.
- id: development_policy
  kind: Policy
  description: A policy that prioritizes rapid iteration and high launch cadence over exhaustive
    pre-flight analysis.
- id: supplier_info_delay
  kind: Delay
  description: The time lag and information filtering that occurs when working with an external component
    supplier.
- id: prototypes
  kind: Resource
  description: The stock of vehicles available for testing.
- id: development_loop
  kind: Loop
- id: months_timescale
  kind: TimeScale
  unit: months
  value: 1-3
