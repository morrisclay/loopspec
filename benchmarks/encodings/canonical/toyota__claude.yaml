convergence_note: "Six loops under the adopted identity rule: one per distinct (timescale, closing\
  \ intervention). This is more than the five I predicted before testing the rule — kanban pull-replenishment\
  \ is the sixth, which I had missed and an independent encoder found first.\nnew_primitives_needed\
  \ is EMPTY, and the two candidates I expected to need were both absorbed by existing primitives:\n\
  - A3 looked like it needed an artifact primitive, which the round-2 adjudicator had flagged\n \
  \ as a gap. It does not: A3 is a Policy (a documented method for structuring a problem) and\n \
  \ its one-sheet limit is a Constraint on that policy. The apparent gap was a missing\n  composition,\
  \ not a missing primitive.\n- goal negotiation across levels looked like it needed something for\
  \ nested objectives. It\n  does not: it is an Intervention with target own-structure that revises\
  \ a DesiredCondition\n  held by a higher level. That composition is exactly the loci-of-goal-formation\
  \ claim from\n  the prior-art gate, and it turns out to be expressible without adding anything.\n"
