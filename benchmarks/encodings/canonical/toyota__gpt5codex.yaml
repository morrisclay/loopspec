  kind: PreferenceOrdering
  ordering: partial across local feasibility, quality, output, and platform effects
- id: management_consequence
  kind: Consequence
  outcome: lost output, quality, and platform performance
- id: level_consequence
  kind: Consequence
  outcome: responsibility for an infeasible accepted objective
- id: worker_consequence
  kind: Consequence
  outcome: passed defect or informal penalty for stopping the line
- id: pull_andon
  kind: Intervention
  target: world
  effect: halt the whole line while origin information is fresh
- id: replenish_exact_quantity
  kind: Intervention
  target: world
- id: inspect_at_gemba
  kind: Intervention
  target: world
  effect: replace report-only assessment with direct observation
- id: adopt_method_change
  kind: Intervention
  target: own-structure
  motive: make a tested improvement the new documented baseline
- id: negotiate_objectives
  kind: Intervention
  target: own-structure
  motive: surface conflicts between organizational levels and timescales
- id: andon_policy
  kind: Policy
  mapping: direct problem observation to immediate line stop
- id: kanban_policy
  kind: Policy
