- id: standardized_work
  kind: Policy
  mapping: current documented best method, used as a revisable baseline
- id: standardized_work_revision
  kind: Revision
  regime: routine-incremental
  change: tested method becomes the new standard
- id: a3_limit
  kind: Constraint
  invariant: problem representation fits one readable A3 sheet
- id: replenishment_lag
