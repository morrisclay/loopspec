notes_on_the_source_example: 'Every construct in the DSL mapped: `loop` to Loop, `goal` to a threshold
  DesiredCondition, `observe X every month` to a Signal plus TimeScale, `estimate X = expr` to an
  Estimator with an expression, `policy { when P do A }` to a Policy with a guard, and `invariant`
  to a Constraint.

  TWO GAPS IT EXPOSED, both now closed as attributes rather than primitives:

  COMPUTED VERSUS LATENT. `runway = cash_balance / burn_rate` is arithmetic over two measured quantities.
  `willingness_to_pay` in the other example is inferred and irreducibly uncertain. The catalog had
  no way to say which, and the difference is load-bearing: a computed estimand needs no Calibration
  because there is no prediction to score. Without the distinction a venture calibrates an arithmetic
  identity while leaving the actual bet unscored.

  POLICY GUARD. `when runway < 12 months do reduce_hiring` separates the firing condition from the
  quantities read. Policy previously had only `based_on`.

  THE INVARIANT REFERENCES SOMETHING NOTHING OBSERVES. `product_velocity >= minimum_viable_rate`
  names a quantity that no `observe` statement collects. It is the same defect the other example
  had — a decision rule reading an unmeasured quantity — appearing here in an invariant rather than
  a policy. In the DSL the two lines sit four lines apart and the gap is invisible; in the graph
  it is one query. Deliberately left unfixed so the derivation catches it.

  ON THE GOAL. `runway > 18 months` is a threshold with a comparator, and the policy fires at 12.
  The gap between the target and the trigger is the deadband — the same structure as the thermostat''s,
  and worth noticing that a venture''s financial policy and a domestic heating controller have the
  identical shape.

  '
