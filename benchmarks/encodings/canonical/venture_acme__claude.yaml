notes_on_the_source_example: 'Twelve of the example''s constructs mapped onto existing primitives
  unchanged. Two did not, and both were real gaps:

  HINGES. Now expressed as Estimand.criticality: existential plus a required resolution_condition,
  rather than as a new primitive. That keeps the budget untouched and makes hinges QUERYABLE — see
  the hinge_without_sensor derivation, which asks which existential hinges have nothing observing
  them. That query is the most direct route from this representation to something a founder does
  not already have written down.

  CALIBRATION. Restored to the catalog. It had been dropped in the v0 derivation because none of
  the four seed descriptions demanded it — a corpus gap, not a real absence. The example''s `calibration_window:
  90d` had nowhere to live.

  ON NESTING. The source example nests everything inside a loop, which reads far better than a flat
  graph and matches the finding that a Loop is the unit that maps to one Durable Object. The flat
  form is kept as the canonical IR because five independent encoders produced five incompatible nested
  shapes and nesting drove the worst comprehensibility scores. Both are the same model: loop-centric
  is a projection, per the charter''s own "the IR is canonical, everything else is a projection"
  architecture.

  ON NUMERIC CONFIDENCE. The example gives `confidence: 0.42`. The startup seed argued that founders
  do not hold calibrated probabilities and that demanding numbers produces theatre. Both are honoured:
  uncertainty_kind is explicit, so a numeric estimate is permitted and marked as such rather than
  being either forced or forbidden. The honest test is whether 0.42 ever changes a decision that
  0.4 or 0.45 would not.

  '
