nodes:
- id: hop_aero
  kind: System
  description: A startup building an autonomous hypersonic cargo rocket.
- id: company_boundary
  kind: Boundary
  description: The boundary of the 6-person startup.
- id: founders
  kind: Party
  description: The founders of Hop Aero.
- id: us_air_force
  kind: Party
  description: The customer, part-funder, and eventual operator. Sits outside the company boundary.
- id: regulator
  kind: Party
  description: A government body like the FAA responsible for range safety and launch licensing.
- id: investors
  kind: Party
  description: Venture capitalists (e.g., YC) providing funding.
- id: airframe_survivability
  kind: Estimand
  description: Whether the airframe can survive the thermal and mechanical loads of flight.
- id: guidance_stability
  kind: Estimand
  description: Whether the guidance system can maintain control through all flight phases.
- id: vehicle_readiness
  kind: Estimand
  description: The overall capability of the vehicle to meet the customer's requirement.
- id: tethered_test_data
  kind: Signal
  description: Data from a tethered test, answering a narrow set of questions.
- id: full_flight_data
  kind: Signal
  description: Data from a full-profile flight, which consumes the vehicle.
- id: flight_analysis
  kind: Estimator
  idempotency_basis: Per-test unique ID.
  description: The process of analyzing test data to update estimates of vehicle performance.
- id: vehicle_performance_estimate
  kind: Estimate
  description: The company's current assessment of the vehicle's capabilities.
- id: af_desired_capability
  kind: DesiredCondition
  description: The Air Force's requirement for fast delivery to contested environments.
- id: vc_desired_progress
  kind: DesiredCondition
  description: The investors' need to see demonstrable progress on a quarterly basis.
- id: company_failure
  kind: Consequence
  description: The company runs out of money and ceases to exist.
- id: failed_bet
  kind: Consequence
  description: The Air Force program office's bet fails, with political exposure.
- id: public_safety_incident
  kind: Consequence
  description: A launch failure causes public harm, a pure downside for the regulator.
- id: portfolio_loss
  kind: Consequence
  description: The investment is lost, one of many in a VC portfolio.
- id: build_tethered_rig
  kind: Intervention
  target: own-structure
  motive: To create a low-cost, reversible way to acquire evidence about propulsion and control.
- id: perform_tethered_test
  kind: Intervention
  target: world
  description: Conduct a test with the vehicle tethered, which is recoverable.
- id: perform_full_flight
  kind: Intervention
  target: world
  description: Conduct a full-profile flight, which is irreversible as it consumes the vehicle.
- id: range_safety
  kind: Constraint
  description: The requirement to have range safety approval before any launch.
- id: launch_license
  kind: Constraint
  description: The requirement to have a launch license before any launch.
- id: vehicle_resource
  kind: Resource
  description: A physical rocket prototype. Consumed in a full flight.
- id: funding
  kind: Resource
  description: The capital available to the company.
- id: vc_timescale
  kind: TimeScale
  unit: months
  value: 3-6
- id: af_timescale
  kind: TimeScale
  unit: years
  value: 1-3
- id: development_loop
  kind: Loop
- id: customer_loop
  kind: Loop
