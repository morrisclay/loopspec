excluded_variables: []
breaks_declared:
- An assumption that the specifications of the product are static.
- An assumption that data from the system is a reliable reflection of reality.
- An assumption that the cost of a failure is a known, quantifiable variable.
- An assumption that agents make decisions to optimize a single, global utility function.
- An assumption that process steps are independent.
- An assumption that the contract defines the rules of engagement.
breaks_handled:
- eco_constraint and tolerance_relaxation capture moving goalposts
- latent estimands capture unreliable data
- multiple consequence nodes capture ambiguous costs
- multiple desired conditions and policies capture local optimization
