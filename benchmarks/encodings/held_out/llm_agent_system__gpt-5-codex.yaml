excluded_variables:
- Hidden chain-of-thought content.
- Exact semantics induced by each prompt and component-local vocabulary.
- Unobserved reasons for thumbs, abandonment, and later bookings.
breaks_declared:
- single_consistent_world_state
- stable_mathematically_defined_objective
- lossless_component_communication
- binary_observable_failure
- human_oversight_out_of_band
- component_behavior_fixed_by_code_and_weights
breaks_handled:
- stable_mathematically_defined_objective
- binary_observable_failure
- human_oversight_out_of_band
- component_behavior_fixed_by_code_and_weights
surfaced: []
reduces_to: null
new_primitives_needed:
- name: SemanticArtifact
  why: Parser JSON, tool directives, retrieved passages, API payloads, and synthesized plans are
    versioned representations passed between components. Each has local semantics and can lose or
    distort meaning without becoming technically invalid.
  which_existing_fails: Signal is an observation rather than a produced message or command. Estimate
    must assess a resolvable estimand and cannot represent directives or retrieved context. System
    contains components but the closed relations cannot express production, consumption, or translation
    of semantic artifacts.
shape: canonical-graph
