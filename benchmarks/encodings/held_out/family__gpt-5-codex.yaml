uras_version: 0
encodes: family
set: held_out
domain: family
encoded_by: gpt-5-codex
encoder_role: independent
nodes:
- id: miller_household
  kind: System
  description: A household allocating money, time, and emotional capacity under uncertainty.
- id: household_boundary
  kind: Boundary
  scope: Sarah, Tom, Leo, Maya, shared resources, commitments, and near-term disruptions.
- id: sarah
  kind: Party
  role: Co-planner and default resolver of scheduling conflicts.
  informal_influence: Reads family cues and can veto plans that exceed emotional reserves.
- id: tom
  kind: Party
  role: Co-planner and income-constrained chore participant.
- id: leo
  kind: Party
  role: Child with activities and context-sensitive needs.
- id: maya
  kind: Party
  role: Child with health needs and context-sensitive tolerance.
- id: cash_through_payday
  kind: Estimand
  criticality: high
  determination: computed
  resolution_condition: Bank balance less known obligations through Friday.
- id: weekly_schedule_feasibility
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: Whether all essential commitments are completed without a cancellation.
- id: meltdown_before_bedtime
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: Whether a child or parent has a disruptive emotional collapse before bedtime.
- id: unexpected_cost_before_payday
  kind: Estimand
  criticality: moderate
  determination: latent
  resolution_condition: All expenses incurred before the next payday become known.
- id: bank_and_obligations
  kind: Signal
  observation: Current balance, payday date, dental co-pay, fuel, and known purchases.
- id: shared_calendar
  kind: Signal
  observation: Work, school, medical, and soccer commitments.
- id: family_behavior_cues
  kind: Signal
  observation: Argumentativeness, quietness, sighing, and accumulated exhaustion.
- id: school_note_and_car_noise
  kind: Signal
  observation: Late field-trip notice and a new mechanical symptom.
- id: cash_estimate
  kind: Estimate
  uncertainty: Known arithmetic with uncertain incidental spending.
- id: schedule_estimate
  kind: Estimate
  uncertainty: Qualitative and vulnerable to new commitments.
- id: meltdown_risk_estimate
  kind: Estimate
  uncertainty: Qualitative, person-specific, and rapidly changing.
- id: surprise_cost_estimate
  kind: Estimate
  uncertainty: Unknown until school or mechanic costs resolve.
- id: cash_check
  kind: Estimator
  form: expression
  expression: bank balance minus known obligations through payday
  idempotency_basis: Bank snapshot timestamp, obligation list version, and payday date.
- id: calendar_triage
  kind: Estimator
  form: judgement
  idempotency_basis: Calendar version and three-day planning-window start.
- id: cue_reading
  kind: Estimator
  form: judgement
  idempotency_basis: Person, observation window, and cue set.
- id: ghost_cost_judgement
  kind: Estimator
  form: judgement
  idempotency_basis: Notice or symptom event plus current quote status.
- id: meet_essential_needs
  kind: DesiredCondition
  condition: Pay essential costs through payday.
- id: avoid_household_red_zone
  kind: DesiredCondition
  condition: Keep emotional demand below current family tolerance.
- id: honor_near_term_commitments
  kind: DesiredCondition
  condition: Cover care, work, school, and health commitments.
- id: contextual_household_preferences
  kind: PreferenceOrdering
  ordering: Partial ordering over solvency, care, time, rest, and enjoyment that changes with context.
  scalarized: 'false'
- id: weekly_satisficing_policy
  kind: Policy
  based_on: cash_through_payday, weekly_schedule_feasibility, meltdown_before_bedtime
  guard: Sunday check-in or a material surprise.
  choice_rule: Take the first feasible plan that protects essentials and avoids immediate overload.
- id: context_exception_policy
  kind: Policy
  based_on: meltdown_before_bedtime, unexpected_cost_before_payday
  guard: A standing heuristic conflicts with health, bravery, or exhaustion.
- id: adjust_week_plan
  kind: Intervention
  target: world
  description: Change spending, meals, transport, chores, or appointments.
- id: reallocate_parent_work
  kind: Intervention
  target: world
  description: Move a chore or schedule disruption between parents.
- id: postpone_discretionary_plan
  kind: Intervention
  target: world
  description: Delay camp, outing, takeout, or social acceptance.
- id: money
  kind: Resource
  stock: Cash available before payday.
  fungibility: Cannot substitute for patience or unavailable time.
- id: parent_time
  kind: Resource
  stock: Schedulable parent hours.
  fungibility: Saturday surplus cannot repair a missed Tuesday commitment.
- id: parent_energy
  kind: Resource
  stock: Attention, patience, and recovery capacity.
  fungibility: Not exchangeable with cash at the moment of overload.
- id: childcare_and_health
  kind: Constraint
  invariant: Children receive necessary supervision and urgent health care.
- id: surprise_resolution_lag
  kind: Delay
  duration: Costs and sickness become clear only after plans have been made.
- id: weekly_scale
  kind: TimeScale
  cadence: weekly
- id: reactive_scale
  kind: TimeScale
  cadence: hours to three days
- id: weekly_planning_loop
  kind: Loop
  description: The Sunday check reallocates the coming week's resources.
- id: reactive_triage_loop
  kind: Loop
  description: New cues and surprises trigger immediate replanning.
- id: sarah_cognitive_load
  kind: Consequence
  outcome: Lost work time, sleep, and emotional capacity.
- id: tom_overload
  kind: Consequence
  outcome: Additional chores and reduced recovery time.
- id: leo_disruption
  kind: Consequence
  outcome: Missed activity, reduced outings, or emotional escalation.
- id: maya_disruption
  kind: Consequence
  outcome: Pain, fatigue, denied preferences, or meltdown.
