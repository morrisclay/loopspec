loops:
- id: weekly_planning_loop
  timescale: weekly_scale
  signal: bank_and_obligations
  intervention: adjust_week_plan
- id: reactive_triage_loop
  timescale: reactive_scale
  signal: family_behavior_cues
  intervention: reallocate_parent_work
excluded_variables:
- Content of the family's tacit interpersonal knowledge.
- Exact timing of illness, car failure, school charges, and invitations.
breaks_declared:
- single_stable_utility_function
- rational_optimizing_agents
- fungible_resources
- information_available_for_decision_making
- costs_explicit_and_evenly_distributed
- fixed_rules
- independent_decisions
breaks_handled:
- single_stable_utility_function
- rational_optimizing_agents
- fungible_resources
- information_available_for_decision_making
- costs_explicit_and_evenly_distributed
- fixed_rules
- independent_decisions
surfaced: []
reduces_to: null
new_primitives_needed:
- name: ResourceFlow
  why: Payday replenishes money and rest replenishes emotional capacity. These inflows are central
    to the rolling forecast, but the graph can encode only stocks and consumption.
  which_existing_fails: Resource represents a depletable stock, while consumes represents only depletion.
    Intervention is an act and cannot state that an exogenous event replenishes a stock; no closed
    relation means replenishes or produces.
shape: canonical-graph
