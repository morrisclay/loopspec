uras_version: 0
encodes: factory
set: held_out
domain: factory
encoded_by: gpt-5-codex
encoder_role: independent
nodes:
- id: apex_sw77b_job
  kind: System
  description: Procurement, stamping, assembly, inspection, and delivery of 10000 SW-77B units.
- id: job_boundary
  kind: Boundary
  scope: Apex production plus supplier and customer dependencies through delivery.
- id: apex_planning
  kind: Party
  role: Commits material and judges supplier delivery.
- id: apex_operations
  kind: Party
  role: Schedules, sets up, produces, and bears job economics.
  informal_influence: Local setup convenience and customer loudness alter priorities.
- id: apex_quality
  kind: Party
  role: Approves first article and samples production.
- id: starkweather
  kind: Party
  role: Defines formal product requirements and receives the assemblies.
  informal_influence: Expected price-downs and negotiated fault narratives shape behavior.
- id: motor_arrival_by_need_date
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: The Globex shipment arrives before assembly requires the motors.
- id: true_assembly_capacity
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: Observed conforming output per shift under current staffing and equipment.
- id: lot_defect_rate
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: A complete functional and dimensional inspection of the lot.
- id: final_job_margin
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: All labor, scrap, penalties, sorting, chargebacks, and revenue are settled.
- id: supplier_portal_status
  kind: Signal
  observation: Globex displays the motor order as In Process with a six-week lead time.
  limitation: The label hides actual production and quality-hold state.
- id: standard_time_and_floor_cues
  kind: Signal
  observation: A 4.5-minute standard plus operator skill and tool-condition observations.
- id: cmm_first_article
  kind: Signal
  observation: Fifteen dimensions on a first stamped housing.
- id: five_per_hour_function_test
  kind: Signal
  observation: Five sampled assemblies each hour.
- id: packed_box_count
  kind: Signal
  observation: Units packed for Friday shipment.
  limitation: Rework inventory is omitted from the Tuesday production number.
- id: supplier_delivery_estimate
  kind: Estimate
  uncertainty: Portal state is coarse and prior quality holds matter.
- id: capacity_estimate
  kind: Estimate
  uncertainty: Standard time omits current operator and equipment effects.
- id: quality_estimate
  kind: Estimate
  uncertainty: A five-piece sample may miss a ten-percent defect batch.
- id: margin_estimate
  kind: Estimate
  uncertainty: Failure costs and reputational damage are negotiated later.
- id: supplier_judgement
  kind: Estimator
  form: judgement
  idempotency_basis: Supplier order, portal snapshot timestamp, and prior-incident dataset version.
- id: capacity_judgement
  kind: Estimator
  form: judgement
  idempotency_basis: Shift, staffing roster, equipment state, and routing version.
- id: sample_quality_estimator
  kind: Estimator
  form: expression
  expression: sample failures divided by five
  idempotency_basis: Lot, hour, and sampled serial numbers.
- id: job_margin_estimator
  kind: Estimator
  form: expression
  expression: recognized revenue minus settled job costs
  idempotency_basis: Job ledger close version.
- id: ship_1250_weekly
  kind: DesiredCondition
  condition: Deliver 1250 accepted units each week starting in week eight.
- id: conform_to_current_drawing
  kind: DesiredCondition
  condition: Output passes the currently authorized engineering drawing.
- id: preserve_job_economics
  kind: DesiredCondition
  condition: Retain the quoted six-percent gross margin and future business.
- id: local_factory_preferences
  kind: PreferenceOrdering
  ordering: Partial ordering over Starkweather delivery, Genodyne penalties, quality, margin, and
    shift effort.
  scalarized: 'false'
- id: material_release_policy
  kind: Policy
  based_on: motor_arrival_by_need_date
  guard: Long-lead material threatens the eight-week start.
- id: first_article_policy
  kind: Policy
  based_on: lot_defect_rate
  guard: A first article is outside the current drawing.
- id: sampling_policy
  kind: Policy
  based_on: lot_defect_rate
  guard: Any of five hourly samples fails.
- id: schedule_triage_policy
  kind: Policy
  based_on: true_assembly_capacity, motor_arrival_by_need_date, final_job_margin
  guard: Weekly delivery or another customer's penalty is at risk.
- id: practical_tolerance_policy
  kind: Policy
  based_on: lot_defect_rate
  guard: Flatness is between .005 and the tacitly accepted .010 inches.
- id: order_buffered_motors
  kind: Intervention
  target: world
  description: Order 10500 sole-source motors.
- id: shim_and_rerun_die
  kind: Intervention
  target: world
  description: Adjust the die and submit another first article.
- id: stop_and_sort
  kind: Intervention
  target: world
  description: Stop production and inspect or rework suspect output.
- id: reschedule_or_add_overtime
  kind: Intervention
  target: world
  description: Move press time or add labor to protect shipment.
- id: change_work_definition
  kind: Intervention
  target: own-structure
  motive: Implement a customer ECO and re-establish an inspectable production baseline.
- id: motors
  kind: Resource
  stock: Sole-source stepper motor inventory.
- id: press_hours
  kind: Resource
  stock: Minster stamping capacity.
- id: job_margin
  kind: Resource
  stock: Quoted gross-margin buffer.
- id: formal_drawing
  kind: Constraint
  invariant: Current Starkweather dimensions and approved components.
- id: sole_source_motor
  kind: Constraint
  invariant: No motor substitution without written customer deviation.
- id: supplier_lead_time
  kind: Delay
  duration: Six weeks nominal plus hidden quality-hold risk.
- id: minutes_scale
  kind: TimeScale
  cadence: first-article iterations
- id: hourly_scale
  kind: TimeScale
  cadence: hourly
- id: weekly_scale
  kind: TimeScale
  cadence: weekly
- id: setup_loop
  kind: Loop
  description: CMM results drive die adjustment until approval.
- id: quality_loop
  kind: Loop
  description: Sample failures can stop and sort production.
- id: delivery_loop
  kind: Loop
  description: Packed output drives weekly schedule intervention.
- id: drain_hole_eco
  kind: Revision
  regime: episodic-discontinuous
  change: Add a drain hole and require a new first article.
- id: planner_firefighting
  kind: Consequence
  outcome: Expediting, overtime, and professional accountability.
- id: apex_loss
  kind: Consequence
  outcome: Scrap, rework, penalties, chargebacks, and lost future business.
- id: quality_accountability
  kind: Consequence
  outcome: Missed defects trigger investigation and corrective action.
- id: customer_downtime
  kind: Consequence
  outcome: Bad units interrupt Starkweather assembly.
