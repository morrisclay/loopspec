excluded_variables:
- Exact tacit die-setting and operator methods.
- Negotiated blame and reputation effects after a failure.
- Globex internal production state.
breaks_declared:
- static_product_specifications
- system_data_reliably_reflects_reality
- failure_cost_known_and_quantifiable
- single_global_utility_optimization
- process_steps_independent
- purchase_order_defines_rules
breaks_handled:
- static_product_specifications
- system_data_reliably_reflects_reality
- failure_cost_known_and_quantifiable
- single_global_utility_optimization
- purchase_order_defines_rules
surfaced: []
reduces_to: null
new_primitives_needed:
- name: ProcessCoupling
  why: A borderline stamped housing remains conforming yet makes downstream assembly slower and harder.
    This is a contingent transfer of difficulty between interventions, not a stock, lag, invariant,
    or goal.
  which_existing_fails: Constraint is invariant and cannot represent a quality-dependent effect.
    Delay represents lag only. Resource represents a depletable stock and loses the workpiece state
    that causes the downstream effect.
shape: canonical-graph
