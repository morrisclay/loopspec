excluded_variables: []
breaks_declared:
- The assumption that all components operate on a single, consistent world-state.
- The assumption of a stable, mathematically defined objective function.
- The assumption that communication between components is lossless.
- The assumption that failure is a binary, observable state.
- The assumption that human oversight is an out-of-band corrective process.
- The assumption that the behavior of a component is fixed by its code and model weights.
breaks_handled:
- component_semantic_alignment estimand captures incommensurable models
- multiple desired conditions capture political compromise
- prompt_revision captures semantic breakdown and ad-hoc changes
- latent estimands capture non-binary failure
- golden_set_constraint captures human oversight as core component
