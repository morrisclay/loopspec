excluded_variables:
- Exact content of skipper tacit fishing knowledge.
- Unobserved illegal discards and black-fish landings.
- Future temperature, plankton, and predator regimes.
breaks_declared:
- reported_landings_are_faithful_unbiased_actual_catch_mortality
