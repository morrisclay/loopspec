reduces_to: null
new_primitives_needed:
- name: Report
  why: Reported landings are assertions generated by regulated parties under economic pressure, and
    may differ knowingly from both catch and measurement. The graph cannot express who asserted a
    datum or that incentives shape its content.
  which_existing_fails: Signal is what is actually measured and has no reporting-party relation.
    Estimate is an uncertainty-bearing assessment of an estimand, not a strategic declaration. Intervention
    changes the world or system structure, not an information record.
shape: canonical-graph
