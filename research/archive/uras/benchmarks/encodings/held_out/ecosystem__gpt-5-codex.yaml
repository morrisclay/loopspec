uras_version: 0
encodes: ecosystem
set: held_out
domain: ecosystem
encoded_by: gpt-5-codex
encoder_role: independent
nodes:
- id: north_sea_cod_governance
  kind: System
  description: Annual assessment, TAC negotiation, quota allocation, and fleet response.
- id: governance_boundary
  kind: Boundary
  scope: North Sea cod stock, assessment institutions, TAC decision, and regulated removals.
- id: ices_scientists
  kind: Party
  role: Produce stock estimates and scientific TAC advice.
- id: fisheries_ministers
  kind: Party
  role: Negotiate and authorize the final TAC.
  informal_influence: Industry pressure raises the political weight of near-term catch.
- id: fleet_and_coastal_communities
  kind: Party
  role: Harvest quota and bear immediate livelihood effects.
  informal_influence: Skipper observations influence belief beyond formal authority.
- id: future_fishers
  kind: Party
  role: Depend on a reproducing stock but lack present authority.
- id: true_spawning_stock_biomass
  kind: Estimand
  criticality: existential
  determination: latent
  resolution_condition: A complete census of mature cod biomass at the assessment date.
- id: actual_fishing_mortality
  kind: Estimand
  criticality: existential
  determination: latent
  resolution_condition: Independently verified total removals and stock exposure for the fishing
    year.
- id: incoming_recruitment
  kind: Estimand
  criticality: high
  determination: latent
  resolution_condition: Cohort abundance observed when the year-class enters the fishery.
- id: survey_catch_age_data
  kind: Signal
  observation: Standard trawl counts, weights, lengths, and otolith ages on a fixed grid.
- id: reported_landings_effort
  kind: Signal
  observation: Mandatory logbooks and sampled landings from the prior year.
  limitation: May omit illegal discards or misreported catch under choke pressure.
- id: on_water_codling_and_location
  kind: Signal
  observation: Skipper sightings of small cod and current fish concentrations.
- id: assessment_ssb
  kind: Estimate
  uncertainty: Model and survey uncertainty.
- id: assessment_mortality
  kind: Estimate
  uncertainty: Sensitive to unreported removals.
- id: assessment_recruitment
  kind: Estimate
  uncertainty: High natural variability and regime sensitivity.
- id: fleet_stock_estimate
  kind: Estimate
  uncertainty: Qualitative and local to recent fishing grounds.
- id: stock_assessment_model
  kind: Estimator
  form: bayesian
  idempotency_basis: Assessment year plus immutable survey, landing, and model-version snapshot.
- id: skipper_judgement
  kind: Estimator
  form: judgement
  idempotency_basis: Vessel, ground, observation date, and radio-report snapshot.
- id: msy_stock_condition
  kind: DesiredCondition
  condition: Biomass and mortality remain compatible with maximum sustainable yield.
- id: viable_fishing_year
  kind: DesiredCondition
  condition: Quota supports vessels, processors, and coastal employment.
- id: tac_tradeoffs
  kind: PreferenceOrdering
  ordering: Partial ordering over stock protection, livelihoods, and other species quotas.
  scalarized: 'false'
- id: scientific_tac_policy
  kind: Policy
  based_on: true_spawning_stock_biomass, actual_fishing_mortality, incoming_recruitment
  guard: Projected removals depart from the MSY path.
- id: negotiated_tac_policy
  kind: Policy
  based_on: true_spawning_stock_biomass, actual_fishing_mortality, incoming_recruitment
  guard: December TAC meeting.
- id: recommend_tac
  kind: Intervention
  target: world
  description: Issue scientific catch advice for the following year.
- id: set_and_allocate_tac
  kind: Intervention
  target: world
  description: Set final TAC and divide it into national and vessel quotas.
- id: relocate_fishing_effort
  kind: Intervention
  target: world
  description: Move effort toward current fish concentrations.
- id: cod_stock
  kind: Resource
  stock: Reproducing North Sea cod population.
- id: landing_obligation
  kind: Constraint
  invariant: Caught cod must be landed rather than discarded.
- id: mixed_fishery_choke
  kind: Constraint
  invariant: Exhausted cod quota can halt fishing despite unused quota for other species.
- id: assessment_and_action_lag
  kind: Delay
  duration: Prior-year landings plus current surveys inform the following fishing year.
- id: annual_management_scale
  kind: TimeScale
  cadence: annual
- id: fleet_adaptation_scale
  kind: TimeScale
  cadence: daily
- id: annual_tac_loop
  kind: Loop
  description: Assessment and negotiation alter next year's removals.
- id: fleet_location_loop
  kind: Loop
  description: Current observations redirect fishing effort.
- id: ices_credibility_loss
  kind: Consequence
  outcome: Repeatedly wrong advice erodes scientific credibility.
- id: political_backlash
  kind: Consequence
  outcome: Ministers bear pressure for immediate losses or later collapse.
- id: livelihood_loss
  kind: Consequence
  outcome: Low quota or closure causes unemployment, default, and community decline.
- id: lost_future_fishery
  kind: Consequence
  outcome: Stock collapse removes ecological and livelihood options for future generations.
