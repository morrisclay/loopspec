surfaced:
  - id: S01
    verdict: unsupported
    reason: "The encoding shows a daily ward round and continuous nursing observation, but it does not represent synchrony, a bottleneck, or information loss."
  - id: S02
    verdict: restatement
    reason: "The encoding supports the authority-observation inversion, but the source states that inversion explicitly."
  - id: S03
    verdict: unsupported
    reason: "Both the source and encoding give the parties different evidence, so the claim that differing information does not contribute is not established."
  - id: S04
    verdict: unsupported
    reason: "The encoding gives the hourly and fortnightly loops different interventions and does not assign ownership to either loop, so the claimed shared intervention and ownership gap are not established."
  - id: S05
    verdict: restatement
    reason: "The encoding represents the consultant's daily evidence and formal authority versus the nurse's continuous evidence and informal block, exactly as the source already explains."
  - id: S06
    verdict: restatement
    reason: "The hourly bed-pressure loop, daily discharge loop, four-hour target, and financial consequence are all stated plainly in the source."
  - id: S07
    verdict: restatement
    reason: "The source explicitly says the deadband prevents relay chatter and is not measurement tolerance."
  - id: S08
    verdict: restatement
    reason: "The source already identifies hallway temperature as a potentially divergent proxy for room comfort that the controller cannot diagnose."
  - id: S09
    verdict: restatement
    reason: "Calling the proxy mapping an identity estimator formalizes, but does not add to, the source's explicit statement that the controller cannot detect signal-comfort divergence."
  - id: S10
    verdict: restatement
    reason: "The encoding correctly separates the deadband as a constraint, but its anti-chatter purpose and non-tolerance status are explicit in the source."
  - id: S11
    verdict: restatement
    reason: "The source directly states that the goal-holder is outside the loop and that the thermostat cannot decide its target is wrong."
