surfaced_cases:
- id: E11
  system: venture_acme
  encoding: venture_acme
  claim: "Policy `choose_intervention` selects interventions using 3 inputs ['willingness_to_pay', 'sales_cycle',\
    \ 'implementation_cost'], but 2 of them ['sales_cycle', 'implementation_cost'] have no signal measuring\
    \ them. The decision rule cannot run as specified \u2014 it reads quantities the system does not collect."
  pattern: policy_on_unmeasured_inputs
  decision_affected: structural consequence of the encoding
- id: E07
  system: hospital
  encoding: hospital
  claim: Estimand `patient_preference` has no signal measuring it. Any estimate of it is formed from something
    the encoding does not record.
  pattern: unmeasured_estimand
  decision_affected: structural consequence of the encoding
- id: E06
  system: hospital
  encoding: hospital
  claim: '`patient` holds estimate `e_preference` with no declared estimator: the encoding records the
    belief but not the process producing it, so nothing constrains how it updates or whether it is idempotent.'
  pattern: estimate_without_estimator
  decision_affected: structural consequence of the encoding
