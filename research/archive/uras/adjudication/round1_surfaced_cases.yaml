surfaced_cases:
- id: S04
  encoding: thermostat-A
  system: thermostat
  claim: "The estimator is the identity function \u2014 the controller treats the signal AS the estimand,\
    \ and nothing in the system can detect when the two diverge."
  decision_affected: whether to add or re-site a sensor, and whether any "smart" feature is worth adding
    before the proxy gap is closed
- id: S06
  encoding: thermostat-A
  system: thermostat
  claim: No party inside the boundary holds the desired condition, so the system cannot represent "the
    target is wrong."
  decision_affected: any request for learning or adaptive behaviour requires first moving the goal inside
    the boundary
- id: S03
  encoding: hospital-B
  system: hospital
  claim: The hourly and fortnightly loops have opposite gradients on the same intervention, and no party
    owns both.
  decision_affected: who, if anyone, should be accountable for the readmission consequence of an hourly
    bed decision
- id: S01
  encoding: hospital-B
  system: hospital
  claim: "Authority and observation are inversely distributed \u2014 the party with continuous observation\
    \ (nurse) holds no discharge authority, and the party with authority (consultant) observes once daily."
  decision_affected: whether to change who may discharge, or to change what the consultant's once-daily
    observation is composed of
- id: S02
  encoding: hospital-B
  system: hospital
  claim: The five estimates differ because the five consequences differ, not because the parties are differently
    informed. Equalising information would not converge them.
  decision_affected: "whether better shared dashboards would help at all \u2014 this predicts they would\
    \ not"
- id: S05
  encoding: thermostat-A
  system: thermostat
  claim: The deadband is a Constraint preventing relay oscillation, not a tolerance on the desired condition.
  decision_affected: "tuning it trades relay lifetime against comfort \u2014 a tradeoff that disappears\
    \ entirely if it is modelled as measurement error"
