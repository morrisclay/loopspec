# Encoded from SWE-agent DefaultAgent at revision
# 3ea751c087f32b16e039a2233dd6eefecef325d5.
# Evidence: sweagent/agent/agents.py lines 1062-1215 and 1235-1294.

loop: swe_agent_default
runs: per_problem_instance

boundary:
  drawn_by: framework_operator
  purpose: turn a repository problem statement into a patch submission
  inside: [language model agent, message history, parser, trajectory, patch collector]
  outside: [problem statement author, repository execution environment, later benchmark grader]

goal:
  issue_resolution:
    keep: a submitted patch that resolves the stated repository problem

beliefs:
  solution_ready:
    question: Is the current repository state ready to submit as the solution?
    how: LLM judgement from the problem statement and accumulated action observations
    explains: issue_resolution
    known_bias: the in-run submission decision is not the later benchmark grader's verdict

observes:
  problem_statement:
    informs: solution_ready
    every: once per instance
    origin: outside
    how: reported
    reported_by: framework_operator

  command_observation:
    informs: solution_ready
    every: after each executed step
    origin: outside
    how: measured
    source: SWEEnv command execution

  patch_submission:
    informs: issue_resolution
    every: on submit or autosubmit
    origin: ourselves
    how: calculated

processes:
  repository_execution:
    description: execute the model-selected shell or editing action in the repository environment
    location: outside
    observed_as: [command_observation]

actions:
  choose_and_execute_step:
    moves: issue_resolution
    through: repository_execution
    effect: unknown
    can_undo: unknown
    consumes: [model_cost]

outputs:
  agent_result:
    kind: final
    terminates: run
    description: AgentRunResult containing the trajectory and best collected patch submission
  run_failure:
    kind: failure
    terminates: run
    description: an interrupt, EOF, or unhandled cost-limit exception that exits the run
  step_status:
    kind: status
    terminates: none
    description: per-step trajectory saves and hook callbacks exposed during the run

operations:
  retry_model_step:
    kind: retry
    when: format, blocklist, syntax, content-policy, or explicit retry handling requeries the model within its bound
  interrupt_run:
    kind: interrupt
    when: KeyboardInterrupt or EOF aborts forwarding immediately
    emits: run_failure
  stop_with_result:
    kind: stop
    when: a normal submission or error-triggered autosubmission marks the step done
    emits: agent_result
  stop_with_failure:
    kind: stop
    when: an unhandled total-cost exception exits the run
    emits: run_failure

when:
  - if: the previous step is not done and model cost remains
    reads: [solution_ready, model_cost]
    do: choose_and_execute_step

people:
  framework_operator:
    human: true
    loses_if_wrong: model spend and reviewer time on an incorrect patch
    sees: [solution_ready, issue_resolution]

  coding_agent:
    agent: true
    loses_if_wrong: nothing
    sees: [solution_ready, issue_resolution]

spends:
  model_cost:
    limit: the configured per-instance cost limit
    replenished: a new problem-instance allocation
    spent_by: [choose_and_execute_step]

not_modelling:
  - the external benchmark grader that runs after patch submission
  - repository-specific test quality
  - operator review or merge policy after the trajectory ends
  - concrete reversibility beyond the explicit request-bound unknown profile
