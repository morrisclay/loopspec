# Stagehand at 7566804ed4b97649706782bccdcab5d80f6fe588.
# Evidence: packages/core/lib/v3/handlers/v3AgentHandler.ts 125-245,
# 297-388, 391-550, 552-715, 738-796, 818-898;
# packages/core/lib/v3/types/public/agent.ts 285-388.

loop: stagehand_v3_agent_run
runs: per_execute_or_stream_invocation

boundary:
  drawn_by: run_caller
  purpose: drive browser and configured tool actions until the done sentinel, an abort, a step bound, or an error closes one invocation
  inside: [V3 agent handler, model-step controller, completion state, action record, usage aggregation]
  outside: [calling application, model provider, browser and websites, custom and MCP tool environments]

goal:
  browser_task:
    keep: the requested browser task reaches a completed result within maxSteps

beliefs:
  next_tool:
    question: Which browser or configured tool call best advances the instruction, or is the task done?
    how: model generation over the system prompt, conversation messages, tool results, and current browser evidence
    explains: browser_task
    settled_by: tool_result

observes:
  instruction:
    informs: [browser_task, next_tool]
    origin: outside
    how: reported
    reported_by: run_caller
  model_step:
    informs: next_tool
    origin: outside
    how: reported
    reported_by: model_provider
  tool_result:
    informs: [browser_task, next_tool]
    origin: ourselves
    how: measured
    produced_by: execute_external_tool

processes:
  browser_and_tool_environment:
    location: outside
    description: DOM, hybrid, search, custom, and MCP tools act on or query the browser, websites, and configured integrations
    observed_as: [tool_result]

actions:
  execute_external_tool:
    moves: browser_task
    through: browser_and_tool_environment
    effect: unknown

action_profiles:
  concrete_tool_request:
    action: execute_external_tool
    default: true
    resolved_at: request
    can_undo: unknown
    description: consequence and reversibility depend on the concrete enabled tool, arguments, browser state, and site

outputs:
  agent_result:
    kind: final
    terminates: run
    description: the completed AgentResult, including final message, actions, optional structured output, and usage
  run_failure:
    kind: failure
    terminates: run
    description: the failed AgentResult or AgentAbortError returned across the invocation boundary
  stream_event:
    kind: status
    terminates: none
    description: a public chunk, step-finish, evidence, or finish event emitted while streaming

operations:
  interrupt_run:
    kind: interrupt
    when: the caller-provided AbortSignal is aborted
    authorized_by: run_caller
    emits: run_failure
  stop_with_result:
    kind: stop
    when: the model calls the controller-only done sentinel with taskComplete or forced finalization establishes completion
    emits: agent_result
  stop_without_completion:
    kind: stop
    when: maxSteps is reached without completion or a non-abort terminal error is converted into a failed result
    emits: run_failure

when:
  - if: the current model step selects an enabled browser, search, custom, or MCP tool other than the done sentinel
    reads: [next_tool, browser_task]
    against: [browser_task]
    do: execute_external_tool

people:
  run_caller:
    kind: system
    loses_if_wrong: browser-side effects, exposed data, money, time, and trust in the result
    sees: [browser_task, next_tool]
  model_provider:
    agent: true
    loses_if_wrong: nothing
    sees: [next_tool]

spends:
  step_budget:
    limit: maxSteps, 20 by default
    replenished: a new execute or stream invocation
    spent_by: execute_external_tool

not_modelling:
  - concrete reversibility or approval policy for each enabled tool and website action
  - provider-specific CUA safety confirmations outside the V3AgentHandler excerpts
