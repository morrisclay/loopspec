surfaced:
- id: D06
  verdict: genuine
  reason: The graph puts patient_preference in the tradeoffs, marks it often-unelicited, and provides
    no measuring signal, exposing a decision-relevant evidential gap not stated plainly in the prose.
  prose_states_it: false
- id: D07
  verdict: unsupported
  reason: No edge connects discharge or its delay to n_unsafe, and the prose instead describes the nurse's
    unsafe-discharge consequence as immediate.
  prose_states_it: false
- id: D09
  verdict: unsupported
  reason: The graph separately records boiler lag and householder discomfort but never relates the intervention
    or delay to that consequence, so it does not establish that the lag falls on the householder.
  prose_states_it: false
- id: D04
  verdict: genuine
  reason: The missing estimator for e_logistics is explicit, is not stated in the prose, and leaves the
    production of a discharge-blocking assessment unspecified.
  prose_states_it: false
- id: D01
  verdict: unsupported
  reason: The graph records total severity and no patient authorization edges, but it has no relation
    showing that every risk-reducing act is unavailable, so unhedgeability does not follow.
  prose_states_it: false
- id: D02
  verdict: restatement
  reason: The graph supports the authority asymmetry, but the prose already says that the patient has
    the least ability to make its assessment count while discharge authority lies elsewhere.
  prose_states_it: true
- id: D08
  verdict: unsupported
  reason: No graph relation connects discharge or readmission_lag to p_harm, so the claim that the lag
    falls on the patient is not established.
  prose_states_it: false
- id: D05
  verdict: trivial
  reason: The absent estimator edge is real, but the graph ties neither updating nor idempotence of the
    patient's qualitative preference to an operational decision.
  prose_states_it: false
- id: D03
  verdict: unsupported
  reason: One relation has ward_round_policy close discharge while another has adjust_threshold revise
    the policy, and neither those unlike roles nor a missing authorizer establishes a shared tradeoff
    with no owner.
  prose_states_it: false
