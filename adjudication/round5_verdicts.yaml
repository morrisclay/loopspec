summary:
  harshest_observation: 'Most claims mistake mechanically detected absences for new insight: eight merely
    expose omissions already visible in the source specifications, three report non-actionable bookkeeping,
    and two do not even preserve the graph''s node identities.

    '
  best_claim: 'E05 is the strongest genuine insight because it connects an unmodeled estimator for logistical
    readiness to a real discharge-blocking power that the prose does not itself identify as an update-process
    gap.

    '
  derivation_vs_assertion: 'From this evidence, computing claims from graph structure does not produce
    better claims than writing them by hand; it gives systematic coverage, but most outputs are restatements
    or query artifacts and still require strict semantic adjudication.

    '
