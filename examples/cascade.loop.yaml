# CASCADE — a slow outer loop setting a fast inner loop's target.
# The standard shape of every control hierarchy, and the one agent systems reach for
# without naming: a "strategy" loop deciding what the "execution" loop should aim at.
#
# Cascade design requires the INNER dynamics to be substantially faster than the outer loop.
# LoopSpec only knows update cadence, so swapping `monthly` and `daily` below produces a review
# signal, not a proof that the pair will oscillate.

loop: strategy
runs: monthly
goal:
  target_cac: { keep: "whatever the model says is affordable" }
observes:
  runway_model: { informs: target_cac, origin: outside, how: calculated }
actions:
  reset_cac_target: { moves: target_cac, can_undo: yes }
when:
  - if: "target_cac changed"
    reads: [target_cac]
    do: reset_cac_target
---
loop: acquisition
runs: daily
goal:
  cost_per_customer:
    keep: below target_cac
    set_by: strategy.target_cac
observes:
  billing_events: { informs: cost_per_customer, origin: outside, how: measured }
actions:
  adjust_spend: { moves: cost_per_customer, can_undo: yes }
when:
  - if: "cost_per_customer above target"
    reads: [cost_per_customer]
    do: adjust_spend
